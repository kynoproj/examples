[project]
name = "kynomesh-langgraph-external-agent"
version = "0.1.0"
description = "A LangGraph supervisor calling a worker that lives in another AgentSet"
requires-python = ">=3.10"
dependencies = [
    "kynomesh>=0.1.1",  # 0.1.1 added KYNOMESH_INSECURE_TLS_PEERS
    "langchain>=1.0",
    "langgraph>=1.0",
    "langchain-openai>=0.3",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/assistant"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]
