# The calculator, deployed as its own AgentSet. The supervisor's AgentSet
# (agentset.yaml) references it as an external agent.
#
# Create the secret first (see README):
#   kubectl create secret generic openai-api-key --from-literal=OPENAI_API_KEY=...
apiVersion: kynomesh.kyno.sh/v1alpha1
kind: AgentSet
metadata:
  name: langgraph-calculator
spec:
  pattern: Supervisor
  entry: calculator
  agents:
    - name: calculator
      container:
        image: langgraph-external:latest
        imagePullPolicy: IfNotPresent
        args: ["--role", "calculator"]
        env:
          - name: OPENAI_API_KEY
            valueFrom:
              secretKeyRef:
                name: openai-api-key
                key: OPENAI_API_KEY
