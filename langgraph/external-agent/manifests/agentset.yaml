# Supervisor + researcher, with the calculator as an EXTERNAL agent: it lives in
# another AgentSet (calculator-agentset.yaml), so nothing is deployed for it here.
#
# Deploy calculator-agentset.yaml first. Create the secret first (see README):
#   kubectl create secret generic openai-api-key --from-literal=OPENAI_API_KEY=...
#
# pattern: Supervisor means the entry agent sees every other agent, including
# external ones; the workers see nobody. An external agent can be called, never
# be the entry.
apiVersion: kynomesh.kyno.sh/v1alpha1
kind: AgentSet
metadata:
  name: langgraph-external
spec:
  pattern: Supervisor
  entry: supervisor
  agents:
    - name: supervisor
      container:
        image: langgraph-external:latest
        imagePullPolicy: IfNotPresent
        args: ["--role", "supervisor"]
        env:
          - name: OPENAI_API_KEY
            valueFrom:
              secretKeyRef:
                name: openai-api-key
                key: OPENAI_API_KEY
          # The calculator's broker presents a self-signed certificate, so skip
          # verification for this peer (encrypted, but not authenticated). Leave
          # this out for a real external agent with a CA-signed certificate.
          - name: KYNOMESH_INSECURE_TLS_PEERS
            value: calculator
    - name: researcher
      container:
        image: langgraph-external:latest
        imagePullPolicy: IfNotPresent
        args: ["--role", "researcher"]
        env:
          - name: OPENAI_API_KEY
            valueFrom:
              secretKeyRef:
                name: openai-api-key
                key: OPENAI_API_KEY
  externalAgents:
    # <agentset>-<agent> is the Service for an agent in another AgentSet. The
    # short name works in the same namespace; otherwise use
    # https://<agentset>-<agent>.<namespace>.svc:8490
    - name: calculator
      url: https://langgraph-calculator-calculator:8490
