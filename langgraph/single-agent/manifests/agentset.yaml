# AgentSet with a single LangGraph chat agent backed by OpenAI.
#
# Create the secret first (see README):
#   kubectl create secret generic openai-api-key --from-literal=OPENAI_API_KEY=...
apiVersion: kynomesh.kyno.sh/v1alpha1
kind: AgentSet
metadata:
  name: langgraph-chat
spec:
  pattern: Supervisor
  entry: chat-agent
  agents:
    - name: chat-agent
      container:
        image: langgraph-chat:latest
        imagePullPolicy: IfNotPresent
        env:
          - name: OPENAI_API_KEY
            valueFrom:
              secretKeyRef:
                name: openai-api-key
                key: OPENAI_API_KEY
