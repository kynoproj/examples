[project]
name = "kynomesh-langgraph-single-agent"
version = "0.1.0"
description = "A single LangGraph agent running as a Kynomesh AgentSet"
requires-python = ">=3.10"
dependencies = [
    "kynomesh>=0.1.2",
    "langgraph>=0.6",
    "openai>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chat_agent"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]
