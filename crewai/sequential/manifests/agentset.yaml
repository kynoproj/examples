# researcher -> writer -> editor, one image. The --role flag picks the stage.
#
# Create the secret first (see README):
#   kubectl create secret generic openai-api-key --from-literal=OPENAI_API_KEY=...
#
# pattern: Sequential means each agent sees only the next one in declaration
# order, and the entry must be the first agent. A stage never names its successor:
# it asks Kynomesh who is next. Reorder or insert agents here and the chain
# follows, with no code change.
apiVersion: kynomesh.kyno.sh/v1alpha1
kind: AgentSet
metadata:
  name: crew-pipeline
spec:
  pattern: Sequential
  entry: researcher
  agents:
    - name: researcher
      container:
        image: crew-pipeline:latest
        imagePullPolicy: IfNotPresent
        args: ["--role", "researcher"]
        env: &openai-env
          - name: OPENAI_API_KEY
            valueFrom:
              secretKeyRef:
                name: openai-api-key
                key: OPENAI_API_KEY
    - name: writer
      container:
        image: crew-pipeline:latest
        imagePullPolicy: IfNotPresent
        args: ["--role", "writer"]
        env: *openai-env
    - name: editor
      container:
        image: crew-pipeline:latest
        imagePullPolicy: IfNotPresent
        args: ["--role", "editor"]
        env: *openai-env
