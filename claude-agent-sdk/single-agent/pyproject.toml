[project]
name = "kynomesh-claude-agent-sdk-single-agent"
version = "0.1.0"
description = "A single Claude Agent SDK agent running as a Kynomesh AgentSet"
requires-python = ">=3.10"
dependencies = [
    "kynomesh>=0.1.0",
    "claude-agent-sdk>=0.2",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/claude_chat"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]
